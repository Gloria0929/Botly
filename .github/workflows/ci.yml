name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botly_test
          POSTGRES_PASSWORD: botly-ci-only-password
          POSTGRES_DB: botly_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botly_test -d botly_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOTLY_TEST_POSTGRES_URL: postgresql+psycopg://botly_test:botly-ci-only-password@127.0.0.1:5432/botly_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.lock pytest pip-audit
      - run: pytest -q
        working-directory: server
      - run: pip-audit
      - run: docker build --tag botly-server:ci .
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: docker build --tag botly-web:ci .
        working-directory: web
