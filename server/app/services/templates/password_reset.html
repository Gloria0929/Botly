<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>重置你的 Botly 密码</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a:focus-visible { outline: 3px solid #818cf8; outline-offset: 4px; }
    @media only screen and (max-width: 600px) {
      .email-outer { padding: 28px 16px !important; }
      .email-content { padding: 30px 24px 32px !important; }
      .email-title { font-size: 28px !important; line-height: 1.35 !important; }
      .email-header { padding-bottom: 24px !important; }
      .email-footer { padding: 24px 8px 0 !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f4f4f5;color:#242424;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f4f4f5;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">在 ${ttl_minutes} 分钟内设置新密码。若非你本人申请，忽略此邮件即可。</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#f4f4f5;">
    <tr>
      <td align="center" class="email-outer" style="padding:48px 24px 40px;">
        <!--[if mso]><table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:580px;table-layout:fixed;">
          <tr>
            <td class="email-header" style="padding:0 4px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td width="42" style="width:42px;vertical-align:middle;">
                    <img src="${logo_url}" width="42" height="42" alt="" style="display:block;width:42px;height:42px;">
                  </td>
                  <td style="padding-left:12px;vertical-align:middle;font-size:26px;line-height:1;font-weight:700;letter-spacing:-1px;color:#242424;">Botly</td>
                  <td align="right" style="vertical-align:middle;font-size:12px;line-height:1.5;color:#7d7d87;">账号服务</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;border:1px solid #e5e5e8;border-radius:20px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;table-layout:fixed;">
                <tr>
                  <td class="email-content" style="padding:40px 44px 42px;">
                    <p style="margin:0 0 14px;font-size:12px;line-height:1.5;letter-spacing:1px;color:#85858f;">密码重置</p>
                    <h1 class="email-title" style="margin:0;font-size:32px;line-height:1.35;letter-spacing:-1px;font-weight:650;color:#242424;">重新设置密码</h1>
                    <p style="margin:20px 0 0;font-size:15px;line-height:1.9;color:#62626d;">我们收到了你的密码重置请求。<br>点击下方按钮，设置一个新密码。</p>
                    <p style="margin:24px 0 18px;font-size:13px;line-height:1.7;color:#73737e;">有效期 <strong style="font-weight:600;color:#242424;">${ttl_minutes} 分钟</strong>&nbsp; · &nbsp;仅可使用一次</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
                      <tr>
                        <td align="center" bgcolor="#242424" style="background-color:#242424;border-radius:10px;mso-padding-alt:16px 24px;">
                          <a data-reset-link href="${reset_link}" style="display:block;padding:16px 24px;font-size:15px;font-weight:600;line-height:22px;text-decoration:none;color:#ffffff;border-radius:10px;">设置新密码&nbsp; &rarr;</a>
                        </td>
                      </tr>
                    </table>
                    <p style="margin:16px 0 0;font-size:12px;line-height:1.8;color:#85858f;">重置后，请在各设备上用新密码登录。</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;margin-top:30px;">
                      <tr><td style="border-top:1px solid #eeeeef;padding-top:26px;">
                        <p style="margin:0 0 7px;font-size:13px;line-height:1.7;font-weight:600;color:#45454f;">没有申请重置？</p>
                        <p style="margin:0;font-size:13px;line-height:1.8;color:#85858f;">忽略即可，你的密码不会改变。</p>
                      </td></tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="email-footer" style="padding:26px 16px 0;">
              <p style="margin:0 0 8px;font-size:12px;line-height:1.8;color:#85858f;">按钮无法打开？复制下面的链接到浏览器：</p>
              <p style="margin:0;font-size:11px;line-height:1.8;word-break:break-all;overflow-wrap:anywhere;">
                <a data-reset-link href="${reset_link}" style="color:#73737e;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">${reset_link}</a>
              </p>
              <p style="margin:30px 0 0;font-size:11px;line-height:1.8;color:#95959e;">Botly &nbsp;·&nbsp; 多智能体工作台<br>此邮件由 Botly 自动发送。</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
