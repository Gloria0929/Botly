name: botly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置}
      POSTGRES_DB: botly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 里设置}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请在 .env 里设置}", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    environment: &backend_env
      BOTLY_SECRET_KEY: ${BOTLY_SECRET_KEY:?请在 .env 里设置}
      BOTLY_ENCRYPTION_KEY: ${BOTLY_ENCRYPTION_KEY:?请在 .env 里设置}
      BOTLY_ENV: ${BOTLY_ENV:-production}
      BOTLY_REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 里设置}@redis:6379/0
      DATABASE_URL: postgresql+psycopg://botly:${POSTGRES_PASSWORD:?请在 .env 里设置}@db:5432/botly
      BOTLY_DATA_DIR: /data
      BOTLY_SANDBOX_PROVIDER: ${BOTLY_SANDBOX_PROVIDER:-none}
      BOTLY_SANDBOX_ADAPTER: ${BOTLY_SANDBOX_ADAPTER:-}
      BOTLY_BASE_URL: ${BOTLY_BASE_URL:-}
      BOTLY_MAIL_DEV: ${BOTLY_MAIL_DEV:-0}
      BOTLY_SMTP_HOST: ${BOTLY_SMTP_HOST:-}
      BOTLY_SMTP_PORT: ${BOTLY_SMTP_PORT:-587}
      BOTLY_SMTP_SECURITY: ${BOTLY_SMTP_SECURITY:-starttls}
      BOTLY_SMTP_USER: ${BOTLY_SMTP_USER:-}
      BOTLY_SMTP_PASSWORD: ${BOTLY_SMTP_PASSWORD:-}
      BOTLY_MAIL_FROM: ${BOTLY_MAIL_FROM:-}
      BOTLY_ADMIN_EMAILS: ${BOTLY_ADMIN_EMAILS:-}
      BOTLY_MCP_STDIO_ENABLED: ${BOTLY_MCP_STDIO_ENABLED:-0}
      BOTLY_MCP_STDIO_ALLOWED_COMMANDS: ${BOTLY_MCP_STDIO_ALLOWED_COMMANDS:-[]}
      BOTLY_ALLOW_PRIVATE_BASE_URL: ${BOTLY_ALLOW_PRIVATE_BASE_URL:-0}
      BOTLY_WORKER_CONCURRENCY: ${BOTLY_WORKER_CONCURRENCY:-20}
      BOTLY_MAX_CONCURRENT_RUNS: ${BOTLY_MAX_CONCURRENT_RUNS:-20}
      BOTLY_DB_POOL_SIZE: ${BOTLY_DB_POOL_SIZE:-10}
      BOTLY_DB_MAX_OVERFLOW: ${BOTLY_DB_MAX_OVERFLOW:-20}
      BOTLY_WORKER_SHUTDOWN_TIMEOUT: ${BOTLY_WORKER_SHUTDOWN_TIMEOUT:-8}
      # 信任 nginx 转发头，否则所有请求都会显示成 nginx 容器 IP，
      # ACC-03 的按 IP 登录限流会变成“一人失败锁全站”。
      FORWARDED_ALLOW_IPS: "172.30.0.2"
    volumes:
      - sandbox:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build: ./server
    user: "0:0"
    command: ["sh", "-c", "chown -R botly:botly /data && python -m app.migrate && chown -R botly:botly /data"]
    environment: *backend_env
    volumes:
      - sandbox:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./server
    stop_grace_period: 30s
    command: ["python", "-m", "app.worker"]
    environment: *backend_env
    volumes:
      - sandbox:/data
    depends_on:
      - api

  web:
    build: ./web
    environment:
      BOTLY_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  redisdata:
  sandbox:
