name: botly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botly}
      POSTGRES_DB: botly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-botly}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-botly}", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    environment: &backend_env
      BOTLY_SECRET_KEY: ${BOTLY_SECRET_KEY:?请在 .env 里设置}
      BOTLY_REDIS_URL: redis://:${REDIS_PASSWORD:-botly}@redis:6379/0
      DATABASE_URL: postgresql+psycopg://botly:${POSTGRES_PASSWORD:-botly}@db:5432/botly
      BOTLY_DATA_DIR: /data
      # 信任 nginx 转发头，否则所有请求都会显示成 nginx 容器 IP，
      # ACC-03 的按 IP 登录限流会变成“一人失败锁全站”。
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - sandbox:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./server
    command: ["python", "-m", "app.worker"]
    environment: *backend_env
    volumes:
      - sandbox:/data
    depends_on:
      - api

  web:
    build: ./web
    environment:
      BOTLY_API_URL: http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  sandbox:
